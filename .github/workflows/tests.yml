name: Tests

on:
  push:
  pull_request:

jobs:
  ai:
    name: AI recommender (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            AI/Algorithm/requirements.txt
            AI/requirements-dev.txt
      - run: pip install -r Algorithm/requirements.txt -r requirements-dev.txt
      - run: pytest

  backend:
    name: Express backend (node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-charging-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ev-charging-backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend logic (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
